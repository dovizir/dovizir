[profile.default]
src = "src"
out = "out"
libs = ["lib"]
# The frozen referee spec (interfaces, TranscriptLib, AuthLib) is imported
# read-only from the acceptance package.
remappings = [
    "forge-std/=lib/forge-std/src/",
    "dovizir-acceptance/=../acceptance/src/",
]
evm_version = "paris"
optimizer = true
optimizer_runs = 200
# Deploy tooling (script/Deploy.s.sol) writes the address map + NEXT_PUBLIC_*
# block to deployments/. Scoped write access; does not affect protocol code.
fs_permissions = [{ access = "read-write", path = "./deployments" }]

[profile.default.fuzz]
runs = 512
[rpc_endpoints]
base_sepolia = "${BASE_SEPOLIA_RPC_URL}"
